# Files an issue here when js-moi-sdk, go-moi or cocolang publishes a release.
# See scripts/upstream-watch.mjs for why each one matters.
name: Upstream watch

on:
  schedule:
    - cron: "17 3 * * *" # daily, 03:17 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report what would be filed without filing it"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/upstream-watch.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # go-moi and cocolang are private. The workflow token can only read
          # this repo, so those two need a read-only token as a repo secret.
          # Without it they are skipped with a warning; js-moi-sdk still works.
          UPSTREAM_READ_TOKEN: ${{ secrets.UPSTREAM_READ_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
